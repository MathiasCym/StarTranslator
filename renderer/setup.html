<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; img-src 'self'; script-src 'self'"><title>星译官 · 安装</title><link rel="stylesheet" href="setup.css"></head><body>
<div class="setup-shell">
  <header><div class="wordmark"><img src="assets/app-icon.png" alt="">星译官<span>STARTRANSLATOR</span></div><div class="window-actions"><button id="setupMin" aria-label="最小化">−</button><button id="setupClose" aria-label="关闭">×</button></div></header>
  <aside class="hero"><div class="orbit orbit-one"></div><div class="orbit orbit-two"></div><span class="star star-one">✦</span><span class="star star-two">✧</span><div class="hero-light"></div><img id="setupMascot" class="hero-mascot" src="assets/welcome.png" alt="星译官形象"><div class="hero-copy"><span class="eyebrow">星译官 · 中英技术文档工作台</span><h1>译步到位。</h1><p>翻译 · 对照 · 术语审校</p></div></aside>
  <main>
    <div class="intro"><span id="setupStep" class="step">准备安装</span><h2 id="setupTitle">欢迎你的星译官</h2><p id="setupDescription">为中英技术文档，搭建一座准确的桥。</p></div>
    <section id="setupOptions"><label class="field-label" for="setupPath">安装位置</label><div class="path-field"><input id="setupPath" spellcheck="false" autocomplete="off"><button id="setupBrowse" aria-label="选择安装位置">选择</button></div><p class="helper" id="setupPathHint">软件将安装到独立文件夹，文档和词库会妥善保留。</p><div class="scope"><span class="field-label">谁可以使用</span><div class="scope-options"><button id="scopeCurrent" class="scope-choice selected" aria-pressed="true"><span class="scope-dot"></span><span>仅我使用<small>当前 Windows 用户</small></span></button><button id="scopeAll" class="scope-choice" aria-pressed="false"><span class="scope-dot"></span><span>所有用户<small>需要管理员授权</small></span></button></div></div></section>
    <section id="setupProgress" hidden><div class="progress-line"><span id="setupPhase" role="status">正在准备</span><span id="setupWorking" class="working">进行中</span></div><div class="progress-track" id="setupMeter" role="progressbar" aria-label="安装进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="setupBar" class="progress-bar"></div></div><ol class="steps"><li id="phaseChecking">确认安装环境</li><li id="phaseFiles">写入程序文件</li><li id="phaseRegistering">完成快捷方式与设置</li><li id="phaseVerifying">校验安装完整性</li></ol></section>
    <section id="setupDone" hidden><span class="done-check">✓</span><h3 id="setupDoneTitle">一切就绪</h3><p id="setupDoneDescription">星译官已准备好，开始你的下一份好译文。</p><span id="setupDonePath"></span></section>
    <p id="setupMessage" role="status"></p><footer><button id="setupAction" class="primary">开始安装<span aria-hidden="true">↗</span></button><button id="setupExit" class="text-button" hidden>完成并关闭</button><span class="publisher">MathiasCym <span id="setupVersion"></span></span></footer>
  </main>
</div><script src="setup.js"></script></body></html>
