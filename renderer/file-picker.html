<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; img-src 'self'; script-src 'self'"><title>星译官 · 文件</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="workspace.css"><link rel="stylesheet" href="file-picker.css"></head>
<body class="picker-body">
  <header class="picker-head"><img src="assets/normal.png" alt=""><div><h2 id="pickerTitle">选择文件</h2><span>星译官 · 文档工作台</span></div><button class="btn ghost sm" id="pickerClose" aria-label="关闭">×</button></header>
  <div class="picker-toolbar"><button class="btn ghost sm" id="pickerBack" aria-label="返回">←</button><button class="btn ghost sm" id="pickerUp" aria-label="上级文件夹">↑</button><form id="pickerPathForm"><input id="pickerPath" aria-label="文件夹路径" placeholder="输入完整路径，也支持共享文件夹"></form><button class="btn ghost sm" id="pickerRefresh" aria-label="刷新">↻</button><button class="btn ghost sm" id="pickerNew">新建文件夹</button></div>
  <div class="picker-content"><nav id="pickerLocations" aria-label="常用位置"></nav><main class="picker-files"><div class="picker-tools"><div class="picker-search"><input id="pickerSearch" type="search" aria-label="搜索当前文件夹" placeholder="搜索当前文件夹"></div><div class="picker-sort"><label for="pickerSort">排序</label><select id="pickerSort"><option value="name">名称</option><option value="modified">修改时间</option><option value="type">文件类型</option><option value="size">文件大小</option></select><button id="pickerOrder" class="btn ghost sm" type="button">升序 ↑</button></div></div><form id="pickerNewForm" hidden><input id="pickerNewName" placeholder="文件夹名称" aria-label="新建文件夹名称"><button class="btn ghost sm" type="submit">创建</button></form><div id="pickerList" role="listbox" aria-label="文件列表" tabindex="0"></div></main></div>
  <footer class="picker-footer"><p id="pickerMessage" role="status"></p><label id="pickerNameRow" hidden><span id="pickerNameLabel">文件名</span><input id="pickerName" autocomplete="off"><textarea id="pickerSelectedNames" readonly aria-label="已选文件名" placeholder="尚未选择文件" hidden></textarea></label><div class="picker-bottom"><span id="pickerType"></span><div class="actions"><button class="btn ghost" id="pickerCancel">取消</button><button class="btn primary" id="pickerAccept">选择文件</button></div></div></footer>
  <script src="file-picker.js"></script>
</body></html>
