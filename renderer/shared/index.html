<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>星译官 · 共享工作台</title><link rel="stylesheet" href="/shared.css"><link rel="stylesheet" href="/progress.css"><link rel="stylesheet" href="/report.css"><link rel="stylesheet" href="/comparison-view.css"></head>
<body><header><div class="brand"><img src="/assets/app-icon.png" width="44" height="44" alt=""><div><strong>星译官</strong><small>译步到位 · 共享工作台</small></div></div><span class="badge">局域网共享</span></header>
<main><div class="heading"><div><small class="eyebrow">STARTRANSLATOR</small><h1>文档工作台</h1></div><p>任务在共享电脑处理，结果由你确认。</p></div>
<div class="columns"><section class="card prepare"><h2><img src="/assets/normal.png" width="44" height="44" alt="">开始新任务</h2><form id="form">
<div class="modes"><label><input type="radio" name="kind" value="translate" checked>翻译</label><label><input type="radio" name="kind" value="check">校对</label><label><input type="radio" name="kind" value="translate_review">翻译并校对</label></div>
<label class="field">待处理文档<input id="files" type="file" accept=".pptx,.docx,.pdf,.xlsx,.txt,.md,.markdown,.html,.htm,.json,.epub,.srt,.ass" multiple required><span id="fileNames" class="hint">支持 Word、PPT、PDF、Excel、文本、Markdown、HTML、JSON、EPUB 和字幕，每份不超过 150 MB。PDF 文字层输出为 Word；扫描件需先识别文字。</span></label>
<label class="field">中英对照与参考材料（可选）<input id="references" type="file" accept=".pptx,.docx,.pdf,.xlsx,.txt,.md,.markdown,.html,.htm,.json,.epub,.srt,.ass" multiple><span id="referenceNames" class="hint"></span></label>
<label class="field" id="outputField">输出方式<select id="outputMode"><option value="final">仅保存最终文件</option><option value="both">保留翻译文件和校对文件</option></select></label><label class="check"><input id="useLlm" type="checkbox" checked>深度审校</label>
<label class="check"><input id="parallelWork" type="checkbox" checked>并发加速</label><button class="primary" id="submit" type="submit">开始任务</button><p id="uploadStatus" class="hint" role="status"></p><div class="shared-progress"><progress id="uploadProgress" max="100" hidden aria-label="上传进度"></progress><span class="shared-reflection" aria-hidden="true"></span></div>
</form></section><section class="card"><div class="section-head"><h2>我的任务</h2><button id="refresh" type="button">刷新</button></div><p class="hint">可继续添加任务；每次最多同时处理两项，其余自动排队。</p><div id="jobs" class="jobs" aria-live="polite"></div></section></div>
<section id="detail" class="card" hidden><div class="section-head"><h2 id="detailTitle"></h2><button id="closeDetail">收起</button></div><p id="detailMessage" role="status"></p><div class="shared-progress"><progress id="taskProgress" max="100" aria-label="任务进度"></progress><span class="shared-reflection" aria-hidden="true"></span></div><div id="results"></div></section>
<p id="error" class="error" role="alert" hidden></p><footer>共享电脑使用已配置的模型和术语库 · <button id="contactAuthor" type="button">联系作者</button></footer></main>
<dialog id="comparison"><div class="section-head"><h2><img src="/assets/normal.png" width="42" height="42" alt="">原文与译文</h2><button id="closeComparison">关闭</button></div><p id="comparisonNote" class="hint"></p><div class="filters"><input id="compareSearch" type="search" placeholder="搜索原文或译文" aria-label="搜索对照"><select id="comparePage" aria-label="筛选页面"><option value="">全部页面</option></select></div><div class="comparison-scroll"><table><thead><tr><th>原文</th><th>译文</th></tr></thead><tbody id="comparisonRows"></tbody></table></div></dialog>
<dialog id="cleanupDialog" class="cleanup-dialog"><h2><img src="/assets/sad.png" width="48" height="48" alt="">删除任务与文件？</h2><p>共享电脑中本次任务的原稿副本、参考材料和输出文件将被删除。请先下载需要保留的结果。你电脑上的原文件不受影响。</p><div class="row-actions"><button id="cancelCleanup">保留任务</button><button id="acceptCleanup" class="primary">确认删除</button></div></dialog>
<dialog id="contactDialog" aria-labelledby="sharedContactTitle"><div class="section-head"><h2 id="sharedContactTitle"><img src="/assets/normal.png" width="44" height="44" alt="">联系作者</h2><button id="closeContact">关闭</button></div><p class="hint">MathiasCym · 星译官</p><label class="contact-email">邮箱<input id="sharedAuthorEmail" value="chenym1@novastar.tech" readonly></label><button id="copySharedEmail" class="primary">复制邮箱</button><p id="sharedContactStatus" class="hint" role="status" aria-live="polite"></p></dialog>
<script src="/comparison-view.js"></script><script src="/shared.js"></script></body></html>
