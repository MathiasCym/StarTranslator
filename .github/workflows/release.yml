name: Build and publish StarTranslator
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'main.js'
      - 'preload.js'
      - 'renderer/**'
      - 'backend/**'
      - 'lib/**'
      - 'build/**'
      - 'tools/**'
      - 'tests/**'
      - 'requirements-runtime.txt'
      - '.github/workflows/release.yml'
permissions:
  contents: write
concurrency:
  group: startranslator-release
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - name: Prepare pinned portable runtime
        run: python tools/bootstrap-runtime.py
      - name: Backend regression checks
        env:
          PYTHONIOENCODING: utf-8
          PYTHONDONTWRITEBYTECODE: '1'
        run: .\python-runtime\python.exe -B tools/run-regressions.py
      - name: Installation and update regression checks
        run: node --test tests/test_release.js tests/test_install_integrity.js tests/test_installation_repair.js tests/test_setup_worker.js tests/test_github_updates.js tests/test_electron_updates.js tests/test_public_sources.js tests/test_domestic_publish.js tests/test_release_repair.js tests/test_runtime_log.js tests/test_update_cache_cleanup.js tests/test_window_size.js tests/test_update_notifications.js tests/test_incremental_update.js tests/test_incremental_source.js
      - name: Desktop readability and dialog checks
        run: |
          node tools/check-readable-ui.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/check-comparison-ui.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/check-window-presentation.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($scenario in @('1080p', '2240-150', '4k-150', '4k-200')) {
            node tools/check-window-presentation.cjs . "display-$scenario" "--display=$scenario"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build exact source version
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: node --require ./tools/nsis-timeout.js node_modules/electron-builder/cli.js --win nsis --x64 --publish never
      - name: Verify extracted installer images and complete payload
        run: node tools/check-release-payload.cjs
      - name: Verify old-runtime small-update launcher and automatic restart
        run: node --test tests/test_small_updater.js
      - name: Build and apply verified small updates from recent releases
        run: node tools/build-incremental.cjs
      - name: Publish verified release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/publish-github.cjs
      - name: Preserve build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-validation
          path: |
            dist/qa/release-200
            dist/qa/readability
            dist/qa/presentation
            dist/qa/comparison
            dist/qa/incremental/*.json
  public-mirror:
    needs: windows
    uses: ./.github/workflows/mirror.yml
    secrets: inherit
