name: Sync owned public mirror
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'glossary/team.json'
      - 'README.md'
      - 'docs/domestic-distribution.md'
      - 'backend/distribution.json'
      - '.github/workflows/mirror.yml'
permissions:
  contents: read
concurrency:
  group: startranslator-public-mirror
  cancel-in-progress: false
jobs:
  mirror:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Sync source, glossary and verified public release
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: node tools/publish-gitcode.cjs
